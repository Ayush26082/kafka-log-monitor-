services:
  kafka:
    image: apache/kafka:3.7.0          # KRaft mode: no ZooKeeper needed
    container_name: kafka
    ports:
      - "9092:9092"                    # for running scripts from your host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      # INTERNAL = containers talk to kafka:19092, EXTERNAL = host talks to localhost:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  init-topics:                         # one-shot job: creates topics, then exits
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:19092
        $$T --bootstrap-server $$B --create --if-not-exists --topic app-logs --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic alerts --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic app-logs.dlq --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --list

  producer:
    build: .
    command: python -m src.producer
    depends_on:
      init-topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PRODUCER_RATE: "5"
      INCIDENT_EVERY_SEC: "30"
    restart: unless-stopped

  log-processor:                       # scale me: docker compose up --scale log-processor=3
    build: .
    command: python -m src.processor
    depends_on:
      init-topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    restart: unless-stopped

  alert-notifier:
    build: .
    command: python -m src.alert_notifier
    depends_on:
      init-topics:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    volumes:
      - ./data:/app/data
    restart: unless-stopped
